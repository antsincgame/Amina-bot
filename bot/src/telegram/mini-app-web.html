<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Амина</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #0f0f12);
      --text: var(--tg-theme-text-color, #f2f2f5);
      --hint: var(--tg-theme-hint-color, #8b8b9a);
      --gold: #d4a853;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #000; color: var(--text); line-height: 1.45;
    }

    /* -- Fullscreen Avatar -- */
    .fullscreen-avatar {
      position: fixed; inset: 0; width: 100vw; height: 100vh;
      overflow: hidden; background: #000;
    }
    .avatar-img {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; object-position: center 20%;
      opacity: 0; transition: opacity .5s ease-in-out;
      animation: breathe 4s ease-in-out infinite, float 6s ease-in-out infinite, blink 5s ease-in-out infinite;
    }
    .avatar-img.active { opacity: 1; }

    @keyframes breathe { 0%,100%{transform:scale(1)} 50%{transform:scale(1.015)} }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
    @keyframes blink { 0%,46%,54%,100%{filter:brightness(1)} 48%,52%{filter:brightness(.9)} }

    /* -- Speaking glow (PNGTubing active) -- */
    .fullscreen-avatar.speaking {
      box-shadow: inset 0 0 80px 20px rgba(212,168,83,.15);
    }
    .fullscreen-avatar.speaking::after {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      border: 2px solid rgba(212,168,83,.25);
      box-shadow: 0 0 30px 10px rgba(212,168,83,.1);
      transition: opacity .3s;
    }

    /* -- Name overlay -- */
    .avatar-name {
      position: absolute; top: 0; left: 0; right: 0; z-index: 5;
      padding: .6rem 1rem .8rem;
      background: linear-gradient(rgba(0,0,0,.7), transparent);
      text-align: center;
    }
    .avatar-name h1 {
      font-size: 1.1rem; font-weight: 700; letter-spacing: .15em;
      color: var(--gold); text-shadow: 0 0 15px rgba(212,168,83,.4);
      text-transform: uppercase;
    }

    /* -- Response overlay -- */
    .response-overlay {
      position: absolute; bottom: 130px; left: 5%; right: 5%; z-index: 10;
      background: linear-gradient(135deg, rgba(0,0,0,.82), rgba(20,10,30,.78));
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-radius: 16px; padding: .8rem 1rem;
      border: 1px solid rgba(212,168,83,.15);
      opacity: 0; transform: translateY(10px);
      transition: opacity .4s ease, transform .4s ease;
      pointer-events: none; max-height: 40vh; overflow-y: auto;
    }
    .response-overlay.visible {
      opacity: 1; transform: translateY(0); pointer-events: auto;
    }
    .user-said {
      font-size: .75rem; color: var(--hint); font-style: italic;
      margin-bottom: .3rem;
    }
    .amina-says {
      font-size: .9rem; color: var(--text); line-height: 1.5;
    }
    .error-text { color: #f66; font-size: .82rem; }

    /* -- Mic area -- */
    .mic-area {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center;
      padding-bottom: max(30px, env(safe-area-inset-bottom, 30px));
      background: linear-gradient(transparent, rgba(0,0,0,.6));
    }
    .status-text {
      font-size: .75rem; color: rgba(255,255,255,.6);
      margin-bottom: .5rem; min-height: 1.2em;
      text-shadow: 0 1px 3px rgba(0,0,0,.8);
    }
    .mic-btn {
      width: 72px; height: 72px; border-radius: 50%;
      background: rgba(20,20,25,.7); border: 2px solid rgba(212,168,83,.4);
      color: rgba(255,255,255,.8); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all .25s ease;
      backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
    }
    .mic-btn:active { transform: scale(.92); }
    .mic-btn:disabled { opacity: .3; cursor: not-allowed; }
    .mic-btn.recording {
      background: rgba(231,76,60,.85); border-color: #e74c3c;
      animation: pulse-rec 1.2s ease-in-out infinite;
      box-shadow: 0 0 20px rgba(231,76,60,.4);
    }
    @keyframes pulse-rec {
      0%,100% { box-shadow: 0 0 0 0 rgba(231,76,60,.5); }
      50% { box-shadow: 0 0 0 14px rgba(231,76,60,0); }
    }

    /* -- Debug log -- */
    .pipeline-log {
      display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
      font-size: .65rem; color: var(--hint); background: rgba(0,0,0,.9);
      padding: .4rem; max-height: 150px; overflow-y: auto; font-family: monospace;
    }
    .pipeline-log.show { display: block; }
    .pipeline-log .entry { margin: 1px 0; }
    .pipeline-log .entry.error { color: #f66; }
    .pipeline-log .entry.ok { color: #6f6; }
  </style>
</head>
<body>
  <div class="fullscreen-avatar" id="avatarArea">
    <img id="avatarImgA" class="avatar-img active" src="/mini-app/avatars/base-neutral.png" alt="Амина" />
    <img id="avatarImgB" class="avatar-img" src="" alt="" />
    <div class="avatar-name"><h1>Амина</h1></div>
    <div class="response-overlay" id="responseOverlay">
      <p class="user-said" id="userSaid"></p>
      <p class="amina-says" id="aminaSays"></p>
    </div>
    <div class="mic-area">
      <div class="status-text" id="status"></div>
      <button type="button" class="mic-btn" id="micBtn" aria-label="Голосовое сообщение">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
    </div>
  </div>
  <div class="pipeline-log" id="pipelineLog"></div>

  <script>
  (function(){
    'use strict';
    var tg=window.Telegram&&window.Telegram.WebApp;
    if(tg){tg.ready();tg.expand();if(tg.setHeaderColor)tg.setHeaderColor('#000000')}
    var initData=(tg&&tg.initData)?String(tg.initData):'';
    var userName=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.first_name)||'друг';

    var micBtn=document.getElementById('micBtn'),
        statusEl=document.getElementById('status'),
        avatarArea=document.getElementById('avatarArea'),
        responseOverlay=document.getElementById('responseOverlay'),
        userSaidEl=document.getElementById('userSaid'),
        aminaSaysEl=document.getElementById('aminaSays'),
        pipelineLogEl=document.getElementById('pipelineLog');

    var isProcessing=false,isRecording=false,mediaRecorder=null,audioChunks=[];
    var apiBase=window.location.origin.replace(/\/$/,'')+'/api';
    var responseTimer=null;

    /* -- Dual-image crossfade -- */
    var imgA=document.getElementById('avatarImgA'),imgB=document.getElementById('avatarImgB');
    var currentImg=imgA,nextImg=imgB,currentEmotion='neutral',crossfading=false;
    var emotionMap={
      neutral:'base-neutral',happy:'emotion-happy',ecstatic:'emotion-ecstatic',
      sad:'emotion-sad',surprised:'emotion-surprised',thinking:'emotion-thinking',
      angry:'emotion-angry',smirk:'emotion-smirk',sleepy:'emotion-sleepy',
      flirty:'emotion-flirty',loving:'emotion-loving'
    };

    var emotionKeys=Object.keys(emotionMap);
    for(var k=0;k<emotionKeys.length;k++){
      var p=new Image();p.src='/mini-app/avatars/'+emotionMap[emotionKeys[k]]+'.png';
    }

    /* -- Debug: triple-tap -- */
    var debugMode=false,tapCount=0,tapTimer=null;
    avatarArea.addEventListener('click',function(e){
      if(e.target===micBtn||micBtn.contains(e.target))return;
      tapCount++;if(tapTimer)clearTimeout(tapTimer);
      tapTimer=setTimeout(function(){tapCount=0},500);
      if(tapCount>=3){debugMode=!debugMode;pipelineLogEl.classList.toggle('show',debugMode);tapCount=0}
    });

    function logPipeline(msg,type){
      var d=document.createElement('div');
      d.className='entry'+(type==='error'?' error':type==='ok'?' ok':'');
      d.textContent='['+new Date().toLocaleTimeString()+'] '+msg;
      pipelineLogEl.appendChild(d);pipelineLogEl.scrollTop=pipelineLogEl.scrollHeight;
    }

    function setStatus(t){if(statusEl)statusEl.textContent=t||''}
    function setLocked(v){isProcessing=v;if(micBtn&&!isRecording)micBtn.disabled=v}

    /* -- Emotion crossfade -- */
    function setEmotion(emotion){
      if(!emotion||emotion===currentEmotion)return;
      var file=emotionMap[emotion]||'base-neutral';
      var newSrc='/mini-app/avatars/'+file+'.png';
      currentEmotion=emotion;
      if(crossfading){currentImg.src=newSrc;return}
      crossfading=true;
      var preload=new Image();
      preload.onload=function(){
        nextImg.src=newSrc;nextImg.classList.add('active');currentImg.classList.remove('active');
        setTimeout(function(){var tmp=currentImg;currentImg=nextImg;nextImg=tmp;crossfading=false},550);
      };
      preload.onerror=function(){crossfading=false};
      preload.src=newSrc;
    }

    /* -- Response overlay -- */
    function showResponse(text,transcript){
      if(responseTimer)clearTimeout(responseTimer);
      if(transcript){userSaidEl.textContent='Вы: '+transcript;userSaidEl.style.display=''}
      else{userSaidEl.textContent='';userSaidEl.style.display='none'}
      aminaSaysEl.textContent=text||'';aminaSaysEl.className='amina-says';
      responseOverlay.classList.add('visible');
      responseTimer=setTimeout(function(){responseOverlay.classList.remove('visible')},8000);
    }
    function showError(text){
      if(responseTimer)clearTimeout(responseTimer);
      userSaidEl.style.display='none';
      aminaSaysEl.textContent=text;aminaSaysEl.className='amina-says error-text';
      responseOverlay.classList.add('visible');
      responseTimer=setTimeout(function(){responseOverlay.classList.remove('visible')},5000);
    }

    /* -- PNGTubing: audio-reactive avatar -- */
    var audioCtx=null,pngTubeRaf=null,currentSource=null,currentAnalyser=null;

    function stopPngTube(){
      if(pngTubeRaf){cancelAnimationFrame(pngTubeRaf);pngTubeRaf=null}
      if(currentSource){try{currentSource.disconnect()}catch(e){}}
      if(currentAnalyser){try{currentAnalyser.disconnect()}catch(e){}}
      currentSource=null;currentAnalyser=null;
      avatarArea.classList.remove('speaking');
      avatarArea.style.boxShadow='';
      if(currentImg){currentImg.style.transform='';currentImg.style.filter=''}
    }

    function startPngTube(analyser){
      var dataArray=new Uint8Array(analyser.fftSize);
      avatarArea.classList.add('speaking');

      function tick(){
        if(!pngTubeRaf)return;
        analyser.getByteTimeDomainData(dataArray);
        var sum=0;
        for(var i=0;i<dataArray.length;i++){var v=(dataArray[i]-128)/128;sum+=v*v}
        var rms=Math.sqrt(sum/dataArray.length);
        var level=Math.min(rms*3.5,1);

        var scale=1.0+level*0.03;
        var ty=-level*5;
        var glow=Math.round(20+level*40);
        var glowAlpha=(0.2+level*0.5).toFixed(2);
        var bright=(1.0+level*0.1).toFixed(3);

        if(currentImg){
          currentImg.style.transform='scale('+scale.toFixed(4)+') translateY('+ty.toFixed(1)+'px)';
          currentImg.style.filter='brightness('+bright+')';
        }
        avatarArea.style.boxShadow='inset 0 0 '+glow+'px '+(8+Math.round(level*12))+'px rgba(212,168,83,'+glowAlpha+')';
        pngTubeRaf=requestAnimationFrame(tick);
      }
      pngTubeRaf=requestAnimationFrame(tick);
    }

    function playAudioBase64(b64,mime){
      if(!b64)return;
      stopPngTube();
      try{
        var bin=atob(b64),bytes=new Uint8Array(bin.length);
        for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
        var blob=new Blob([bytes],{type:mime||'audio/mpeg'}),url=URL.createObjectURL(blob);
        var a=new Audio(url);

        if(!audioCtx){var AC=window.AudioContext||window.webkitAudioContext;if(AC)audioCtx=new AC()}

        var cleanup=function(){stopPngTube();URL.revokeObjectURL(url)};

        if(audioCtx&&audioCtx.state!=='closed'){
          var source=audioCtx.createMediaElementSource(a);
          var analyser=audioCtx.createAnalyser();
          analyser.fftSize=256;analyser.smoothingTimeConstant=0.7;
          source.connect(analyser);analyser.connect(audioCtx.destination);
          currentSource=source;currentAnalyser=analyser;
          a.onplay=function(){if(audioCtx.state==='suspended')audioCtx.resume();startPngTube(analyser)};
        }else{
          a.onplay=function(){avatarArea.classList.add('speaking')};
        }
        a.onended=function(){cleanup()};
        a.onerror=function(){cleanup()};
        a.onpause=function(){stopPngTube()};
        a.play().catch(function(){cleanup()});
      }catch(e){}
    }

    /* -- Voice recording (MediaRecorder) -- */
    async function startRecording(){
      if(isProcessing||isRecording)return;
      try{
        logPipeline('Requesting mic…');
        var stream=await navigator.mediaDevices.getUserMedia({audio:true});audioChunks=[];
        var mimes=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'],sel='';
        for(var i=0;i<mimes.length;i++){if(mimes[i]&&MediaRecorder.isTypeSupported(mimes[i])){sel=mimes[i];break}}
        logPipeline('Mime: '+(sel||'default'));
        mediaRecorder=new MediaRecorder(stream,sel?{mimeType:sel}:{});
        mediaRecorder.ondataavailable=function(e){if(e.data&&e.data.size>0)audioChunks.push(e.data)};
        mediaRecorder.onstop=function(){
          stream.getTracks().forEach(function(t){t.stop()});
          var blob=new Blob(audioChunks,{type:mediaRecorder.mimeType||'audio/webm'});
          logPipeline('Rec done, size='+blob.size);
          if(blob.size>0)sendVoiceToServer(blob);
          audioChunks=[];
        };
        mediaRecorder.onerror=function(e){logPipeline('Rec err: '+(e.error?e.error.message:'?'),'error');stopRecording()};
        mediaRecorder.start();isRecording=true;micBtn.classList.add('recording');
        setStatus('Говорите… нажмите ещё раз');logPipeline('Recording','ok');
      }catch(e){
        logPipeline('Mic denied: '+e.message,'error');
        showError('Нет доступа к микрофону');
        setStatus('');
      }
    }

    function stopRecording(){
      if(!mediaRecorder||!isRecording)return;
      try{if(mediaRecorder.state==='recording')mediaRecorder.stop()}catch(e){}
      isRecording=false;micBtn.classList.remove('recording');setStatus('');
    }

    async function sendVoiceToServer(blob){
      if(!initData){showError('Откройте из Telegram');return}
      setLocked(true);setStatus('Распознаю речь…');setEmotion('thinking');
      logPipeline('Voice → server, size='+blob.size);
      var ext=blob.type.includes('mp4')?'mp4':blob.type.includes('ogg')?'ogg':'webm';
      var fd=new FormData();fd.append('audio',blob,'voice.'+ext);fd.append('initData',initData);
      try{
        var res=await fetch(apiBase+'/mini-app/voice',{method:'POST',body:fd});
        var json=await res.json().catch(function(){return null});
        if(!res.ok||!json||!json.success){
          var err=(json&&json.error)||'Ошибка сервера ('+res.status+')';
          showError(err);logPipeline('API '+res.status+': '+err,'error');return;
        }
        setStatus('');
        var tr=json.data.transcript||'';
        logPipeline('STT: "'+tr.slice(0,80)+'" emotion='+json.data.emotion,'ok');
        handleAiResponse(json.data,tr);
      }catch(e){showError('Сеть недоступна');logPipeline('Voice err: '+e.message,'error')}
      finally{setLocked(false);setStatus('')}
    }

    if(micBtn)micBtn.addEventListener('click',function(){if(isRecording)stopRecording();else startRecording()});

    /* -- Response handling -- */
    function handleAiResponse(data,transcript){
      var text=data.response||'';
      showResponse(text,transcript);
      setEmotion(data.emotion||'neutral');
      if(data.audioBase64)playAudioBase64(data.audioBase64,data.audioMimeType);
    }

    logPipeline('PNGTuber mode loaded for '+userName,'ok');
  })();
  </script>
</body>
</html>
