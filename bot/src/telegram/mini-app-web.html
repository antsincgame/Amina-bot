<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Амина</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #0a0a0e);
      --text: var(--tg-theme-text-color, #e8e6f0);
      --hint: var(--tg-theme-hint-color, #6a6880);
      --mechanicus-red: #8b1a1a;
      --mechanicus-red-glow: #c62828;
      --mechanicus-gold: #b8860b;
      --mechanicus-gold-dim: rgba(184, 134, 11, 0.3);
      --mechanicus-dark: #0d0d12;
      --mechanicus-panel: rgba(20, 18, 28, 0.85);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--mechanicus-dark);
      color: var(--text);
    }

    .app {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ── Particle canvas ── */
    #particleCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* ── Name display ── */
    .name-display {
      position: absolute;
      top: max(env(safe-area-inset-top, 12px), 12px);
      left: 0;
      right: 0;
      text-align: center;
      z-index: 10;
      pointer-events: none;
    }

    .name-display h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--mechanicus-gold);
      text-shadow:
        0 0 20px var(--mechanicus-gold-dim),
        0 0 40px rgba(184, 134, 11, 0.15),
        0 2px 4px rgba(0, 0, 0, 0.6);
    }

    /* ── Avatar container ── */
    .avatar-container {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      animation: breathe 4s ease-in-out infinite;
      transition: opacity 0.4s ease;
    }

    .avatar-img.loading {
      opacity: 0.7;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1.0); }
      50% { transform: scale(1.02); }
    }

    /* ── Audio visualizer ring ── */
    .visualizer-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(85vw, 85vh);
      height: min(85vw, 85vh);
      border-radius: 50%;
      z-index: 2;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s ease;
      border: 2px solid transparent;
    }

    .visualizer-ring.active {
      opacity: 1;
      border-color: var(--mechanicus-red-glow);
      box-shadow:
        0 0 15px rgba(198, 40, 40, 0.3),
        0 0 30px rgba(198, 40, 40, 0.15),
        inset 0 0 15px rgba(198, 40, 40, 0.1);
      animation: visualizerPulse 0.8s ease-in-out infinite;
    }

    @keyframes visualizerPulse {
      0%, 100% { box-shadow: 0 0 15px rgba(198, 40, 40, 0.3), 0 0 30px rgba(198, 40, 40, 0.15); }
      50% { box-shadow: 0 0 25px rgba(198, 40, 40, 0.5), 0 0 50px rgba(198, 40, 40, 0.25); }
    }

    /* ── Thinking overlay ── */
    .thinking-overlay {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(10, 10, 14, 0.4);
      pointer-events: none;
    }

    .thinking-overlay.active {
      display: flex;
    }

    .gear-spinner {
      width: 64px;
      height: 64px;
      animation: gearSpin 2s linear infinite;
      opacity: 0.7;
    }

    @keyframes gearSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* ── Bottom controls ── */
    .bottom-controls {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: max(env(safe-area-inset-bottom, 20px), 20px);
      background: linear-gradient(to top, rgba(10, 10, 14, 0.9) 0%, rgba(10, 10, 14, 0.6) 60%, transparent 100%);
      pointer-events: none;
    }

    .bottom-controls > * {
      pointer-events: auto;
    }

    /* ── Status text ── */
    .status-text {
      font-size: 0.82rem;
      color: var(--hint);
      letter-spacing: 0.05em;
      margin-bottom: 14px;
      min-height: 1.2em;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      transition: color 0.3s ease;
    }

    .status-text.listening { color: var(--mechanicus-red-glow); }
    .status-text.thinking { color: var(--mechanicus-gold); }
    .status-text.speaking { color: #66bb6a; }

    /* ── Mic button ── */
    .mic-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 3px solid var(--mechanicus-red);
      background: rgba(139, 26, 26, 0.25);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      position: relative;
      -webkit-tap-highlight-color: transparent;
    }

    .mic-btn:active {
      transform: scale(0.93);
    }

    .mic-btn:not(:disabled):hover {
      background: rgba(139, 26, 26, 0.4);
      box-shadow: 0 0 20px rgba(198, 40, 40, 0.4);
    }

    .mic-btn.recording {
      background: rgba(198, 40, 40, 0.5);
      border-color: var(--mechanicus-red-glow);
      animation: micPulse 1.2s ease-in-out infinite;
    }

    .mic-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    @keyframes micPulse {
      0%, 100% {
        box-shadow: 0 0 10px rgba(198, 40, 40, 0.4);
      }
      50% {
        box-shadow: 0 0 30px rgba(198, 40, 40, 0.7), 0 0 60px rgba(198, 40, 40, 0.3);
      }
    }

    .mic-icon {
      width: 28px;
      height: 28px;
      fill: currentColor;
    }

    /* ── Error toast ── */
    .error-toast {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      background: rgba(198, 40, 40, 0.9);
      color: #fff;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 0.85rem;
      max-width: 90vw;
      text-align: center;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .error-toast.visible {
      opacity: 1;
    }

    /* ── No speech API fallback notice ── */
    .no-speech-notice {
      position: absolute;
      bottom: 110px;
      left: 20px;
      right: 20px;
      z-index: 10;
      background: var(--mechanicus-panel);
      border: 1px solid var(--mechanicus-gold-dim);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 0.8rem;
      color: var(--hint);
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
  <div class="app">
    <canvas id="particleCanvas"></canvas>

    <div class="name-display">
      <h1>Амина</h1>
    </div>

    <div class="avatar-container">
      <img
        class="avatar-img"
        id="avatarImg"
        src="/mini-app/avatars/base-neutral.png"
        alt="Амина"
        draggable="false"
      />
    </div>

    <div class="visualizer-ring" id="visualizerRing"></div>

    <div class="thinking-overlay" id="thinkingOverlay">
      <svg class="gear-spinner" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <path fill="rgba(184,134,11,0.7)" d="M50 10 L54 0 H46 L50 10z M50 90 L54 100 H46 L50 90z M10 50 L0 46 V54 L10 50z M90 50 L100 46 V54 L90 50z M21.7 21.7 L14.6 14.6 L7.1 21.2 L17.6 25.9z M78.3 78.3 L85.4 85.4 L92.9 78.8 L82.4 74.1z M21.7 78.3 L14.6 85.4 L21.2 92.9 L25.9 82.4z M78.3 21.7 L85.4 14.6 L78.8 7.1 L74.1 17.6z"/>
        <circle cx="50" cy="50" r="30" fill="none" stroke="rgba(184,134,11,0.5)" stroke-width="6"/>
        <circle cx="50" cy="50" r="18" fill="none" stroke="rgba(184,134,11,0.4)" stroke-width="4"/>
        <circle cx="50" cy="50" r="8" fill="rgba(184,134,11,0.5)"/>
      </svg>
    </div>

    <div class="bottom-controls">
      <div class="status-text" id="statusText"></div>
      <button class="mic-btn" id="micBtn" type="button" aria-label="Голосовой ввод">
        <svg class="mic-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
          <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
      </button>
    </div>

    <div class="error-toast" id="errorToast"></div>
    <div class="no-speech-notice" id="noSpeechNotice">
      Web Speech API недоступен в этом браузере. Голосовой ввод не поддерживается.
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      /* ── Telegram WebApp ── */
      var tg = window.Telegram && window.Telegram.WebApp;
      if (tg) {
        tg.ready();
        tg.expand();
      }
      var initData = (tg && tg.initData) ? String(tg.initData) : '';

      /* ── DOM refs ── */
      var avatarImg = document.getElementById('avatarImg');
      var micBtn = document.getElementById('micBtn');
      var statusText = document.getElementById('statusText');
      var thinkingOverlay = document.getElementById('thinkingOverlay');
      var visualizerRing = document.getElementById('visualizerRing');
      var errorToast = document.getElementById('errorToast');
      var noSpeechNotice = document.getElementById('noSpeechNotice');
      var particleCanvas = document.getElementById('particleCanvas');

      /* ── State ── */
      var EMOTIONS = [
        'neutral', 'happy', 'ecstatic', 'sad', 'surprised',
        'thinking', 'angry', 'smirk', 'sleepy', 'flirty', 'loving'
      ];
      var currentEmotion = 'neutral';
      var isRecording = false;
      var isBusy = false;
      var currentAudio = null;
      var errorToastTimer = null;

      /* ── Helpers ── */
      function setStatus(text, cls) {
        if (!statusText) return;
        statusText.textContent = text || '';
        statusText.className = 'status-text' + (cls ? ' ' + cls : '');
      }

      function showError(msg) {
        if (!errorToast) return;
        errorToast.textContent = msg;
        errorToast.classList.add('visible');
        if (errorToastTimer) clearTimeout(errorToastTimer);
        errorToastTimer = setTimeout(function () {
          errorToast.classList.remove('visible');
        }, 4000);
      }

      function setEmotion(emotion) {
        if (!avatarImg) return;
        if (EMOTIONS.indexOf(emotion) === -1) emotion = 'neutral';
        if (emotion === currentEmotion) return;
        currentEmotion = emotion;
        avatarImg.classList.add('loading');
        var src = emotion === 'neutral'
          ? '/mini-app/avatars/base-neutral.png'
          : '/mini-app/avatars/emotion-' + emotion + '.png';
        var img = new Image();
        img.onload = function () {
          avatarImg.src = src;
          avatarImg.classList.remove('loading');
        };
        img.onerror = function () {
          avatarImg.classList.remove('loading');
        };
        img.src = src;
      }

      /* ── Audio playback ── */
      function playAudioBase64(b64, mime) {
        return new Promise(function (resolve) {
          if (!b64) { resolve(); return; }
          try {
            var bin = atob(b64);
            var bytes = new Uint8Array(bin.length);
            for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            var blob = new Blob([bytes], { type: mime || 'audio/mpeg' });
            var url = URL.createObjectURL(blob);
            var audio = new Audio(url);
            currentAudio = audio;

            setStatus('Говорю...', 'speaking');
            visualizerRing.classList.add('active');

            audio.addEventListener('ended', function () {
              URL.revokeObjectURL(url);
              currentAudio = null;
              visualizerRing.classList.remove('active');
              setStatus('');
              resolve();
            });
            audio.addEventListener('error', function () {
              URL.revokeObjectURL(url);
              currentAudio = null;
              visualizerRing.classList.remove('active');
              setStatus('');
              resolve();
            });
            audio.play().catch(function () {
              URL.revokeObjectURL(url);
              currentAudio = null;
              visualizerRing.classList.remove('active');
              setStatus('');
              showError('Не удалось воспроизвести аудио.');
              resolve();
            });
          } catch (e) {
            showError('Ошибка декодирования аудио.');
            resolve();
          }
        });
      }

      /* ── Bot API ── */
      function sendToBot(text) {
        if (isBusy) return;
        if (!initData) {
          showError('Откройте мини-приложение из Telegram.');
          return;
        }
        if (!text || !text.trim()) return;

        isBusy = true;
        micBtn.disabled = true;
        setStatus('Думаю...', 'thinking');
        thinkingOverlay.classList.add('active');

        var api = window.location.origin.replace(/\/$/, '') + '/api/mini-app/message';

        fetch(api, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            initData: initData,
            message: text.trim(),
            withAudio: true
          })
        })
        .then(function (res) {
          return res.json().then(
            function (json) { return { ok: res.ok, status: res.status, data: json }; },
            function () { return { ok: false, status: res.status, data: null }; }
          );
        })
        .then(function (result) {
          thinkingOverlay.classList.remove('active');

          if (!result.ok || !result.data || !result.data.success) {
            var err = (result.data && result.data.error) ? result.data.error : ('HTTP ' + result.status);
            if (result.status === 502 || result.status === 503 || result.status === 504) {
              err = 'Сервер временно недоступен (' + result.status + '). Попробуйте через минуту.';
            } else if (result.status === 401) {
              err = 'Сессия устарела. Переоткройте мини-приложение.';
            }
            showError(err);
            setStatus('');
            isBusy = false;
            micBtn.disabled = false;
            return;
          }

          var d = result.data.data;
          var emotion = (d && d.emotion) ? String(d.emotion) : 'neutral';
          setEmotion(emotion);

          var audioB64 = d && d.audioBase64;
          var audioMime = d && d.audioMimeType;

          if (audioB64) {
            playAudioBase64(audioB64, audioMime).then(function () {
              setTimeout(function () { setEmotion('neutral'); }, 2000);
              isBusy = false;
              micBtn.disabled = false;
            });
          } else {
            setStatus('');
            setTimeout(function () { setEmotion('neutral'); }, 3000);
            isBusy = false;
            micBtn.disabled = false;
          }
        })
        .catch(function () {
          thinkingOverlay.classList.remove('active');
          showError('Сеть недоступна.');
          setStatus('');
          isBusy = false;
          micBtn.disabled = false;
        });
      }

      /* ── Speech Recognition ── */
      var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      var recognition = null;

      if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'ru-RU';
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        recognition.addEventListener('result', function (e) {
          var transcript = '';
          for (var i = 0; i < e.results.length; i++) {
            transcript += e.results[i][0].transcript;
          }
          stopRecording();
          if (transcript.trim()) {
            sendToBot(transcript);
          } else {
            setStatus('');
          }
        });

        recognition.addEventListener('error', function (e) {
          stopRecording();
          if (e.error === 'no-speech') {
            setStatus('Не услышала. Попробуйте ещё раз.');
            setTimeout(function () { setStatus(''); }, 2500);
          } else if (e.error === 'not-allowed') {
            showError('Доступ к микрофону запрещён. Разрешите в настройках.');
          } else {
            showError('Ошибка распознавания: ' + e.error);
          }
        });

        recognition.addEventListener('end', function () {
          if (isRecording) stopRecording();
        });
      } else {
        if (noSpeechNotice) noSpeechNotice.style.display = 'block';
        if (micBtn) micBtn.disabled = true;
      }

      function startRecording() {
        if (!recognition || isRecording || isBusy) return;
        if (currentAudio) {
          currentAudio.pause();
          currentAudio = null;
          visualizerRing.classList.remove('active');
        }
        isRecording = true;
        micBtn.classList.add('recording');
        setStatus('Слушаю...', 'listening');
        try {
          recognition.start();
        } catch (e) {
          stopRecording();
          showError('Не удалось запустить запись.');
        }
      }

      function stopRecording() {
        if (!isRecording) return;
        isRecording = false;
        micBtn.classList.remove('recording');
        try { recognition.stop(); } catch (e) { /* already stopped */ }
      }

      /* ── Mic button handler ── */
      if (micBtn) {
        micBtn.addEventListener('click', function () {
          if (isBusy) return;
          if (isRecording) {
            stopRecording();
            setStatus('');
          } else {
            startRecording();
          }
        });
      }

      /* ── Particle system (cog/gear theme) ── */
      (function initParticles() {
        if (!particleCanvas) return;
        var ctx = particleCanvas.getContext('2d');
        if (!ctx) return;

        var particles = [];
        var PARTICLE_COUNT = 25;
        var animFrameId = null;

        function resize() {
          particleCanvas.width = window.innerWidth;
          particleCanvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        function createParticle() {
          return {
            x: Math.random() * particleCanvas.width,
            y: Math.random() * particleCanvas.height,
            size: 4 + Math.random() * 10,
            speedX: (Math.random() - 0.5) * 0.3,
            speedY: -0.15 - Math.random() * 0.3,
            rotation: Math.random() * Math.PI * 2,
            rotSpeed: (Math.random() - 0.5) * 0.01,
            opacity: 0.05 + Math.random() * 0.12,
            teeth: 6 + Math.floor(Math.random() * 4)
          };
        }

        for (var i = 0; i < PARTICLE_COUNT; i++) {
          particles.push(createParticle());
        }

        function drawGear(x, y, size, rotation, teeth, opacity) {
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(rotation);
          ctx.globalAlpha = opacity;
          ctx.strokeStyle = 'rgba(184, 134, 11, 1)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          var outerR = size;
          var innerR = size * 0.65;
          var toothH = size * 0.35;
          var steps = teeth * 2;
          for (var s = 0; s < steps; s++) {
            var angle = (s / steps) * Math.PI * 2;
            var r = (s % 2 === 0) ? outerR + toothH : outerR;
            var px = Math.cos(angle) * r;
            var py = Math.sin(angle) * r;
            if (s === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(0, 0, innerR * 0.5, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        function animateParticles() {
          ctx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
          for (var i = 0; i < particles.length; i++) {
            var p = particles[i];
            p.x += p.speedX;
            p.y += p.speedY;
            p.rotation += p.rotSpeed;

            if (p.y < -p.size * 3) {
              p.y = particleCanvas.height + p.size * 3;
              p.x = Math.random() * particleCanvas.width;
            }
            if (p.x < -p.size * 3) p.x = particleCanvas.width + p.size * 3;
            if (p.x > particleCanvas.width + p.size * 3) p.x = -p.size * 3;

            drawGear(p.x, p.y, p.size, p.rotation, p.teeth, p.opacity);
          }
          animFrameId = requestAnimationFrame(animateParticles);
        }

        animateParticles();

        document.addEventListener('visibilitychange', function () {
          if (document.hidden) {
            if (animFrameId) { cancelAnimationFrame(animFrameId); animFrameId = null; }
          } else {
            if (!animFrameId) animateParticles();
          }
        });
      })();

    })();
  </script>
</body>
</html>
