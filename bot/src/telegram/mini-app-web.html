<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Амина</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #0f0f12);
      --text: var(--tg-theme-text-color, #f2f2f5);
      --hint: var(--tg-theme-hint-color, #8b8b9a);
      --btn: var(--tg-theme-button-color, #3390ec);
      --btn-text: var(--tg-theme-button-text-color, #fff);
      --card: color-mix(in srgb, var(--tg-theme-text-color, #fff) 7%, transparent);
      --gold: #d4a853;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.45;
    }

    /* -- Avatar area -- */
    .avatar-area {
      position: relative; width: 100%; aspect-ratio: 1/1; max-height: 45vh;
      overflow: hidden; background: radial-gradient(ellipse at center, #1a1025, #0f0f12);
      display: flex; align-items: center; justify-content: center;
      border-radius: 0 0 16px 16px;
      transition: box-shadow .4s ease;
    }
    .avatar-img {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; object-fit: contain;
      opacity: 0;
      transition: opacity .45s ease-in-out;
      animation: avatar-breathe 4s ease-in-out infinite, avatar-float 6s ease-in-out infinite, avatar-blink 5s ease-in-out infinite;
      will-change: transform, opacity;
    }
    .avatar-img.active { opacity: 1; }

    /* -- Speaking state -- */
    .avatar-area.speaking {
      box-shadow: 0 0 20px 4px rgba(212,168,83,.35), 0 0 60px 8px rgba(212,168,83,.12);
    }
    .avatar-area.speaking .avatar-img.active {
      animation: avatar-breathe 4s ease-in-out infinite, avatar-speak-bounce .7s ease-in-out infinite, avatar-blink 5s ease-in-out infinite;
    }

    /* -- Keyframes -- */
    @keyframes avatar-breathe {
      0%, 100% { transform: scale(1) translateY(0); }
      50% { transform: scale(1.012) translateY(0); }
    }
    @keyframes avatar-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes avatar-blink {
      0%, 46%, 54%, 100% { opacity: 1; }
      48%, 52% { opacity: .88; }
    }
    @keyframes avatar-speak-bounce {
      0%, 100% { transform: scale(1.012) translateY(0); }
      50% { transform: scale(1.018) translateY(-2px); }
    }
    @keyframes avatar-speak-glow-pulse {
      0%, 100% { box-shadow: 0 0 20px 4px rgba(212,168,83,.35); }
      50% { box-shadow: 0 0 30px 8px rgba(212,168,83,.55); }
    }

    .avatar-name {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 2;
      padding: 2rem 1rem .75rem; background: linear-gradient(transparent, rgba(15,15,18,.95)); text-align: center;
    }
    .avatar-name h1 { font-size: 1.15rem; font-weight: 700; color: var(--gold); text-shadow: 0 0 12px rgba(212,168,83,.3); }
    .avatar-name .subtitle { font-size: .75rem; color: var(--hint); margin-top: .15rem; }

    /* -- Chat -- */
    .chat-area { flex: 1; overflow-y: auto; padding: .5rem .75rem; min-height: 80px; }
    .bubble { margin: .35rem 0; padding: .5rem .65rem; border-radius: 14px; font-size: .88rem; max-width: 85%; word-wrap: break-word; }
    .bubble.user { background: color-mix(in srgb, var(--btn) 30%, transparent); margin-left: auto; border-bottom-right-radius: 4px; }
    .bubble.amina { background: var(--card); border-bottom-left-radius: 4px; }
    .bubble.err { color: #f66; font-size: .82rem; }
    .bubble .transcript { font-size: .75rem; color: var(--hint); margin-bottom: .2rem; font-style: italic; }

    /* -- Input -- */
    .input-area {
      padding: .5rem .75rem .75rem;
      background: color-mix(in srgb, var(--bg) 95%, var(--text));
      border-top: 1px solid color-mix(in srgb, var(--text) 8%, transparent);
    }
    .input-row { display: flex; gap: .4rem; align-items: flex-end; }
    .text-input {
      flex: 1; min-height: 40px; max-height: 100px; resize: none; border-radius: 20px;
      border: 1px solid color-mix(in srgb, var(--text) 15%, transparent);
      background: var(--card); color: var(--text); padding: .5rem .75rem; font-size: .9rem; font-family: inherit; outline: none;
    }
    .text-input:focus { border-color: color-mix(in srgb, var(--btn) 50%, transparent); }
    .icon-btn {
      width: 40px; height: 40px; border-radius: 50%; border: none;
      display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: all .2s;
    }
    .icon-btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn-send { background: var(--btn); color: var(--btn-text); }
    .btn-mic { background: transparent; color: var(--hint); border: 1px solid color-mix(in srgb, var(--text) 15%, transparent); }
    .btn-mic.recording { background: #e74c3c; color: #fff; border-color: #e74c3c; animation: pulse-rec 1s infinite; }
    @keyframes pulse-rec { 0%,100%{box-shadow:0 0 0 0 rgba(231,76,60,.4)} 50%{box-shadow:0 0 0 8px rgba(231,76,60,0)} }
    .status-bar { font-size: .75rem; color: var(--hint); text-align: center; padding: .2rem; min-height: 1.2em; }

    /* -- Debug log -- */
    .pipeline-log { display:none; font-size:.7rem; color:var(--hint); background:rgba(0,0,0,.3); padding:.5rem; max-height:120px; overflow-y:auto; font-family:monospace; border-top:1px solid color-mix(in srgb,var(--text) 5%,transparent); }
    .pipeline-log.show { display: block; }
    .pipeline-log .entry { margin: 1px 0; }
    .pipeline-log .entry.error { color: #f66; }
    .pipeline-log .entry.ok { color: #6f6; }
  </style>
</head>
<body>
  <div class="avatar-area" id="avatarArea">
    <img id="avatarImgA" class="avatar-img active" src="/mini-app/avatars/base-neutral.png" alt="Амина" />
    <img id="avatarImgB" class="avatar-img" src="" alt="" />
    <div class="avatar-name">
      <h1>Амина</h1>
      <p class="subtitle" id="greeting">Загрузка…</p>
    </div>
  </div>
  <div class="chat-area" id="chatLog" aria-live="polite"></div>
  <p class="status-bar" id="status"></p>
  <div class="input-area">
    <div class="input-row">
      <button type="button" class="icon-btn btn-mic" id="micBtn" title="Голосовое сообщение">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
      <textarea class="text-input" id="msg" rows="1" placeholder="Напиши что-нибудь…"></textarea>
      <button type="button" class="icon-btn btn-send" id="sendBtn" title="Отправить">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
  <div class="pipeline-log" id="pipelineLog"></div>
  <script>
  (function(){
    'use strict';
    var tg=window.Telegram&&window.Telegram.WebApp;
    if(tg){tg.ready();tg.expand()}
    var initData=(tg&&tg.initData)?String(tg.initData):'';
    var userName=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.first_name)||'друг';
    var chatLog=document.getElementById('chatLog'),msgEl=document.getElementById('msg'),
        sendBtn=document.getElementById('sendBtn'),micBtn=document.getElementById('micBtn'),
        statusEl=document.getElementById('status'),greetingEl=document.getElementById('greeting'),
        avatarArea=document.getElementById('avatarArea'),
        pipelineLogEl=document.getElementById('pipelineLog');
    var isProcessing=false,isRecording=false,mediaRecorder=null,audioChunks=[];
    var apiBase=window.location.origin.replace(/\/$/,'')+'/api';

    /* -- Dual-image crossfade state -- */
    var imgA=document.getElementById('avatarImgA');
    var imgB=document.getElementById('avatarImgB');
    var currentImg=imgA,nextImg=imgB;
    var currentEmotion='neutral',crossfading=false;
    var emotionMap={
      neutral:'base-neutral',
      happy:'emotion-happy',
      ecstatic:'emotion-ecstatic',
      sad:'emotion-sad',
      surprised:'emotion-surprised',
      thinking:'emotion-thinking',
      angry:'emotion-angry',
      smirk:'emotion-smirk',
      sleepy:'emotion-sleepy',
      flirty:'emotion-flirty',
      loving:'emotion-loving'
    };

    /* -- Preload all emotion images -- */
    var emotionFiles=Object.keys(emotionMap);
    for(var k=0;k<emotionFiles.length;k++){
      var preImg=new Image();
      preImg.src='/mini-app/avatars/'+emotionMap[emotionFiles[k]]+'.png';
    }

    /* -- Debug mode: triple-tap avatar -- */
    var debugMode=false,tapCount=0,tapTimer=null;
    avatarArea.addEventListener('click',function(){
      tapCount++;if(tapTimer)clearTimeout(tapTimer);
      tapTimer=setTimeout(function(){tapCount=0},500);
      if(tapCount>=3){debugMode=!debugMode;pipelineLogEl.classList.toggle('show',debugMode);tapCount=0}
    });
    function logPipeline(msg,type){
      var d=document.createElement('div');
      d.className='entry'+(type==='error'?' error':type==='ok'?' ok':'');
      d.textContent='['+new Date().toLocaleTimeString()+'] '+msg;
      pipelineLogEl.appendChild(d);pipelineLogEl.scrollTop=pipelineLogEl.scrollHeight;
      if(type==='error')console.error('[PIPELINE]',msg);else console.log('[PIPELINE]',msg);
    }
    function setStatus(t){if(statusEl)statusEl.textContent=t||''}
    function setLocked(v){isProcessing=v;if(sendBtn)sendBtn.disabled=v;if(micBtn&&!isRecording)micBtn.disabled=v}
    function appendBubble(text,cls){
      if(!chatLog)return;var d=document.createElement('div');d.className='bubble '+(cls||'');
      d.textContent=text;chatLog.appendChild(d);chatLog.scrollTop=chatLog.scrollHeight;
    }

    /* -- Emotion crossfade -- */
    function setEmotion(emotion){
      if(!emotion||emotion===currentEmotion)return;
      var file=emotionMap[emotion]||'base-neutral';
      var newSrc='/mini-app/avatars/'+file+'.png';
      currentEmotion=emotion;
      if(crossfading){
        currentImg.src=newSrc;
        return;
      }
      crossfading=true;
      var preload=new Image();
      preload.onload=function(){
        nextImg.src=newSrc;
        nextImg.classList.add('active');
        currentImg.classList.remove('active');
        setTimeout(function(){
          var tmp=currentImg;
          currentImg=nextImg;
          nextImg=tmp;
          crossfading=false;
        },500);
      };
      preload.onerror=function(){crossfading=false};
      preload.src=newSrc;
    }

    /* -- Audio playback with speaking state -- */
    function playAudioBase64(b64,mime){
      if(!b64)return;
      try{
        var bin=atob(b64),bytes=new Uint8Array(bin.length);
        for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
        var blob=new Blob([bytes],{type:mime||'audio/mpeg'}),url=URL.createObjectURL(blob);
        var a=new Audio(url);
        a.onplay=function(){
          avatarArea.classList.add('speaking');
          logPipeline('Audio playing','ok');
        };
        a.onended=function(){
          avatarArea.classList.remove('speaking');
          logPipeline('Audio ended');
        };
        a.onerror=function(){avatarArea.classList.remove('speaking')};
        a.onpause=function(){avatarArea.classList.remove('speaking')};
        a.play().catch(function(e){logPipeline('Audio play blocked: '+e.message,'error')});
        setTimeout(function(){URL.revokeObjectURL(url)},120000);
      }catch(e){logPipeline('Audio error: '+e.message,'error')}
    }

    /* -- Greeting -- */
    if(greetingEl)greetingEl.textContent='Техножрица Омниссии приветствует тебя, '+userName;
    if(msgEl){
      msgEl.addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,100)+'px'});
      msgEl.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendTextMessage()}});
    }

    /* -- Text message -- */
    async function sendTextMessage(){
      if(isProcessing)return;
      if(!initData){appendBubble('Откройте из Telegram.','err');return}
      var text=msgEl?msgEl.value.trim():'';if(!text)return;
      setLocked(true);setStatus('Думаю…');appendBubble(text,'user');
      if(msgEl){msgEl.value='';msgEl.style.height='auto'}
      setEmotion('thinking');logPipeline('TEXT → '+text.slice(0,60));
      try{
        var res=await fetch(apiBase+'/mini-app/message',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({initData:initData,message:text,withAudio:true})});
        var json=await res.json().catch(function(){return null});
        if(!res.ok||!json||!json.success){handleApiError(res.status,(json&&json.error)||'HTTP '+res.status);return}
        logPipeline('OK emotion='+json.data.emotion,'ok');handleAiResponse(json.data);
      }catch(e){appendBubble('Сеть недоступна.','err');logPipeline('Net: '+e.message,'error')}
      finally{setLocked(false);setStatus('')}
    }
    if(sendBtn)sendBtn.addEventListener('click',sendTextMessage);

    /* -- Voice recording (MediaRecorder) -- */
    async function startRecording(){
      if(isProcessing||isRecording)return;
      try{
        logPipeline('Requesting mic…');
        var stream=await navigator.mediaDevices.getUserMedia({audio:true});audioChunks=[];
        var mimes=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus',''],sel='';
        for(var i=0;i<mimes.length;i++){if(!mimes[i]||MediaRecorder.isTypeSupported(mimes[i])){sel=mimes[i];break}}
        logPipeline('Mime: '+(sel||'default'));
        mediaRecorder=new MediaRecorder(stream,sel?{mimeType:sel}:{});
        mediaRecorder.ondataavailable=function(e){if(e.data&&e.data.size>0)audioChunks.push(e.data)};
        mediaRecorder.onstop=function(){
          stream.getTracks().forEach(function(t){t.stop()});
          var blob=new Blob(audioChunks,{type:mediaRecorder.mimeType||'audio/webm'});
          logPipeline('Rec done, size='+blob.size);if(blob.size>0)sendVoiceToServer(blob);audioChunks=[];
        };
        mediaRecorder.onerror=function(e){logPipeline('Rec err: '+(e.error?e.error.message:'?'),'error');stopRecording()};
        mediaRecorder.start();isRecording=true;micBtn.classList.add('recording');
        setStatus('Говорите… (нажмите снова)');logPipeline('Recording','ok');
      }catch(e){logPipeline('Mic denied: '+e.message,'error');setStatus('Нет доступа к микрофону');setTimeout(function(){setStatus('')},3000)}
    }
    function stopRecording(){
      if(!mediaRecorder||!isRecording)return;
      try{if(mediaRecorder.state==='recording')mediaRecorder.stop()}catch(e){}
      isRecording=false;micBtn.classList.remove('recording');
    }
    async function sendVoiceToServer(blob){
      if(!initData){appendBubble('Откройте из Telegram.','err');return}
      setLocked(true);setStatus('Распознаю речь…');setEmotion('thinking');
      logPipeline('Voice → server, size='+blob.size);
      var ext=blob.type.includes('mp4')?'mp4':blob.type.includes('ogg')?'ogg':'webm';
      var fd=new FormData();fd.append('audio',blob,'voice.'+ext);fd.append('initData',initData);
      try{
        var res=await fetch(apiBase+'/mini-app/voice',{method:'POST',body:fd});
        var json=await res.json().catch(function(){return null});
        if(!res.ok||!json||!json.success){handleApiError(res.status,(json&&json.error)||'HTTP '+res.status);return}
        var tr=json.data.transcript||'';
        logPipeline('STT: "'+tr.slice(0,80)+'" emotion='+json.data.emotion,'ok');
        if(tr)appendBubble(tr,'user');handleAiResponse(json.data);
      }catch(e){appendBubble('Сеть недоступна.','err');logPipeline('Voice err: '+e.message,'error')}
      finally{setLocked(false);setStatus('')}
    }
    if(micBtn)micBtn.addEventListener('click',function(){if(isRecording)stopRecording();else startRecording()});

    /* -- Response handling -- */
    function handleAiResponse(data){
      appendBubble(data.response||'','amina');
      setEmotion(data.emotion||'neutral');
      if(data.audioBase64)playAudioBase64(data.audioBase64,data.audioMimeType);
    }
    function handleApiError(status,err){
      if(status===502||status===503||status===504)err='Сервер недоступен ('+status+'). Подождите.';
      else if(status===401)err='Сессия устарела. Откройте Амину заново.';
      appendBubble('Ошибка: '+err,'err');logPipeline('API '+status+': '+err,'error');
    }

    logPipeline('Mini App loaded, CSS avatar mode','ok');
  })();
  </script>
</body>
</html>
