<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Амина</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #0f0f12);
      --text: var(--tg-theme-text-color, #f2f2f5);
      --hint: var(--tg-theme-hint-color, #8b8b9a);
      --gold: #d4a853;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #000; color: var(--text); line-height: 1.45;
    }
    .fullscreen-avatar {
      position: fixed; inset: 0; width: 100vw; height: 100vh;
      overflow: hidden; background: #000;
    }
    #live2dCanvas {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover;
    }
    .speaking { box-shadow: inset 0 0 80px 20px rgba(212,168,83,.15); }
    .speaking::after {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      border: 2px solid rgba(212,168,83,.25);
      box-shadow: 0 0 30px 10px rgba(212,168,83,.1);
    }
    .avatar-name {
      position: absolute; top: 0; left: 0; right: 0; z-index: 5;
      padding: .6rem 1rem .8rem;
      background: linear-gradient(rgba(0,0,0,.7), transparent);
      text-align: center;
    }
    .avatar-name h1 {
      font-size: 1.1rem; font-weight: 700; letter-spacing: .15em;
      color: var(--gold); text-shadow: 0 0 15px rgba(212,168,83,.4);
      text-transform: uppercase;
    }
    .response-overlay {
      position: absolute; bottom: 130px; left: 5%; right: 5%; z-index: 10;
      background: linear-gradient(135deg, rgba(0,0,0,.82), rgba(20,10,30,.78));
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-radius: 16px; padding: .8rem 1rem;
      border: 1px solid rgba(212,168,83,.15);
      opacity: 0; transform: translateY(10px);
      transition: opacity .4s ease, transform .4s ease;
      pointer-events: none; max-height: 40vh; overflow-y: auto;
    }
    .response-overlay.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .close-overlay {
      position: absolute; top: 8px; right: 10px;
      background: none; border: none; color: rgba(255,255,255,.5);
      font-size: 1.2rem; cursor: pointer; padding: 4px 8px; line-height: 1;
    }
    .close-overlay:hover { color: #fff; }
    .user-said { font-size: .75rem; color: var(--hint); font-style: italic; margin-bottom: .3rem; }
    .amina-says { font-size: .9rem; color: var(--text); line-height: 1.5; }
    .error-text { color: #f66; font-size: .82rem; }
    .mic-area {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center;
      padding-bottom: max(30px, env(safe-area-inset-bottom, 30px));
      background: linear-gradient(transparent, rgba(0,0,0,.6));
    }
    .status-text {
      font-size: .75rem; color: rgba(255,255,255,.6);
      margin-bottom: .5rem; min-height: 1.2em;
      text-shadow: 0 1px 3px rgba(0,0,0,.8);
    }
    .mic-btn {
      width: 72px; height: 72px; border-radius: 50%;
      background: rgba(20,20,25,.7); border: 2px solid rgba(212,168,83,.4);
      color: rgba(255,255,255,.8); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all .25s ease;
      backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
    }
    .mic-btn:active { transform: scale(.92); }
    .mic-btn:disabled { opacity: .3; cursor: not-allowed; }
    .mic-btn.recording {
      background: rgba(231,76,60,.85); border-color: #e74c3c;
      animation: pulse-rec 1.2s ease-in-out infinite;
      box-shadow: 0 0 20px rgba(231,76,60,.4);
    }
    @keyframes pulse-rec {
      0%,100% { box-shadow: 0 0 0 0 rgba(231,76,60,.5); }
      50% { box-shadow: 0 0 0 14px rgba(231,76,60,0); }
    }
    .pipeline-log {
      display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
      font-size: .65rem; color: var(--hint); background: rgba(0,0,0,.9);
      padding: .4rem; max-height: 150px; overflow-y: auto; font-family: monospace;
    }
    .pipeline-log.show { display: block; }
    .pipeline-log .entry { margin: 1px 0; }
    .pipeline-log .entry.error { color: #f66; }
    .pipeline-log .entry.ok { color: #6f6; }
  </style>
</head>
<body>
  <div class="fullscreen-avatar" id="avatarArea">
    <canvas id="live2dCanvas"></canvas>
    <div class="avatar-name"><h1>Амина</h1></div>
    <div class="response-overlay" id="responseOverlay">
      <button class="close-overlay" id="closeOverlay" aria-label="Закрыть">&times;</button>
      <p class="user-said" id="userSaid"></p>
      <p class="amina-says" id="aminaSays"></p>
    </div>
    <div class="mic-area">
      <div class="status-text" id="status"></div>
      <button type="button" class="mic-btn" id="micBtn" aria-label="Голосовое сообщение">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
    </div>
  </div>
  <div class="pipeline-log" id="pipelineLog"></div>

  <script>
  (function(){
    'use strict';

    /* ===== Telegram WebApp init ===== */
    var tg=window.Telegram&&window.Telegram.WebApp;
    if(tg){tg.ready();tg.expand();if(tg.setHeaderColor)tg.setHeaderColor('#000000')}
    var initData=(tg&&tg.initData)?String(tg.initData):'';
    var userName=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.first_name)||'';

    /* ===== DOM refs ===== */
    var canvas=document.getElementById('live2dCanvas');
    var ctx=canvas.getContext('2d');
    var micBtn=document.getElementById('micBtn');
    var statusEl=document.getElementById('status');
    var avatarArea=document.getElementById('avatarArea');
    var responseOverlay=document.getElementById('responseOverlay');
    var userSaidEl=document.getElementById('userSaid');
    var aminaSaysEl=document.getElementById('aminaSays');
    var pipelineLogEl=document.getElementById('pipelineLog');

    var isProcessing=false,isRecording=false,mediaRecorder=null,audioChunks=[];
    var apiBase=window.location.origin.replace(/\/$/,'')+'/api';
    var responseTimer=null,recordStartTime=0;
    var MIN_RECORD_MS=1200;

    /* ===== Debug log ===== */
    var debugMode=false,tapCount=0,tapTimer=null;
    avatarArea.addEventListener('click',function(e){
      if(e.target===micBtn||micBtn.contains(e.target))return;
      tapCount++;if(tapTimer)clearTimeout(tapTimer);
      tapTimer=setTimeout(function(){tapCount=0},500);
      if(tapCount>=3){debugMode=!debugMode;pipelineLogEl.classList.toggle('show',debugMode);tapCount=0}
    });
    function logPipeline(msg,type){
      var d=document.createElement('div');
      d.className='entry'+(type==='error'?' error':type==='ok'?' ok':'');
      d.textContent='['+new Date().toLocaleTimeString()+'] '+msg;
      pipelineLogEl.appendChild(d);pipelineLogEl.scrollTop=pipelineLogEl.scrollHeight;
      if(pipelineLogEl.childNodes.length>200)pipelineLogEl.removeChild(pipelineLogEl.firstChild);
    }
    function setStatus(t){if(statusEl)statusEl.textContent=t||''}
    function setLocked(v){isProcessing=v;if(micBtn&&!isRecording)micBtn.disabled=v}

    /* ===== Emotion mapping ===== */
    var emotionMap={
      neutral:'base-neutral',happy:'emotion-happy',ecstatic:'emotion-ecstatic',
      sad:'emotion-sad',surprised:'emotion-surprised',thinking:'emotion-thinking',
      angry:'emotion-angry',smirk:'emotion-smirk',sleepy:'emotion-sleepy',
      flirty:'emotion-flirty',loving:'emotion-loving'
    };
    var emotionShort={
      neutral:'neutral',happy:'happy',ecstatic:'ecstatic',sad:'sad',
      surprised:'surprised',thinking:'thinking',angry:'angry',smirk:'smirk',
      sleepy:'sleepy',flirty:'flirty',loving:'loving'
    };

    /* ===== Canvas sizing ===== */
    var MODEL_W=832,MODEL_H=1216;
    function resizeCanvas(){
      var dpr=window.devicePixelRatio||1;
      var vw=window.innerWidth,vh=window.innerHeight;
      canvas.width=vw*dpr;canvas.height=vh*dpr;
      canvas.style.width=vw+'px';canvas.style.height=vh+'px';
      ctx.setTransform(1,0,0,1,0,0);
    }
    resizeCanvas();
    window.addEventListener('resize',resizeCanvas);

    /* ===== Image loader with LRU cache (max 30 entries) ===== */
    var imageCache={};
    var imageCacheOrder=[];
    var IMAGE_CACHE_MAX=30;

    function loadImage(url){
      if(imageCache[url]){
        var idx=imageCacheOrder.indexOf(url);
        if(idx>-1){imageCacheOrder.splice(idx,1);imageCacheOrder.push(url)}
        return Promise.resolve(imageCache[url]);
      }
      return new Promise(function(resolve,reject){
        var img=new Image();
        img.onload=function(){
          imageCache[url]=img;imageCacheOrder.push(url);
          while(imageCacheOrder.length>IMAGE_CACHE_MAX){
            var old=imageCacheOrder.shift();delete imageCache[old];
          }
          resolve(img);
        };
        img.onerror=function(){reject(new Error('Failed: '+url))};
        img.src=url;
      });
    }

    /* ===== Layer System ===== */
    var currentEmotion='neutral';
    var layers={base:null,eyelids:null,mouth_open:null,hair_back:null,hair_front:null};
    var layersReady=false;
    var loadingEmotion=null;

    function getBaseUrl(emotion){return '/mini-app/avatars/'+emotionMap[emotion]+'.png'}
    function getLayerUrl(emotion,layer){return '/mini-app/avatars/layers/'+emotionShort[emotion]+'/'+layer+'.png'}
    function getSharedUrl(layer){return '/mini-app/avatars/layers/shared/'+layer+'.png'}

    function loadEmotionLayers(emotion){
      loadingEmotion=emotion;
      return Promise.all([
        loadImage(getBaseUrl(emotion)),
        loadImage(getLayerUrl(emotion,'eyelids')).catch(function(){return null}),
        loadImage(getLayerUrl(emotion,'mouth_open')).catch(function(){return null}),
        loadImage(getSharedUrl('hair_back')).catch(function(){return null}),
        loadImage(getSharedUrl('hair_front')).catch(function(){return null}),
      ]).then(function(imgs){
        if(loadingEmotion!==emotion)return;
        layers.base=imgs[0];
        layers.eyelids=imgs[1];
        layers.mouth_open=imgs[2];
        layers.hair_back=imgs[3];
        layers.hair_front=imgs[4];
        layersReady=true;
        logPipeline('Layers: '+emotion+(imgs[1]?' +eyelids':'')+(imgs[2]?' +mouth':''),'ok');
      }).catch(function(e){
        logPipeline('Layer error: '+e.message+' - base only fallback','error');
        return loadImage(getBaseUrl(emotion)).then(function(img){
          if(loadingEmotion!==emotion)return;
          layers.base=img;layers.eyelids=null;layers.mouth_open=null;
          layersReady=true;
        });
      });
    }

    /* ===== Parameter Driver ===== */
    var params={
      rms:0,smoothRms:0,
      breathPhase:0,breathRate:0.8,
      blinkState:'open',blinkProgress:0,blinkTimer:0,nextBlinkDelay:3000,
      headTime:0,headX:0,headY:0,
      hairBack:{angle:0,velocity:0,stiffness:60,damping:6},
      hairFront:{angle:0,velocity:0,stiffness:100,damping:8},
      isSpeaking:false,
      glowIntensity:0,
    };

    /* ===== Blink State Machine ===== */
    function updateBlink(dt){
      params.blinkTimer-=dt;
      if(params.blinkState==='open'){
        if(params.blinkTimer<=0){params.blinkState='closing';params.blinkProgress=0}
      }else if(params.blinkState==='closing'){
        params.blinkProgress+=dt/80;
        if(params.blinkProgress>=1){params.blinkProgress=1;params.blinkState='closed';params.blinkTimer=50}
      }else if(params.blinkState==='closed'){
        if(params.blinkTimer<=0)params.blinkState='opening';
      }else if(params.blinkState==='opening'){
        params.blinkProgress-=dt/120;
        if(params.blinkProgress<=0){
          params.blinkProgress=0;params.blinkState='open';
          params.blinkTimer=2000+Math.random()*3000;
        }
      }
    }

    function easeInOutQuad(t){return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2}

    function updateSpring(spring,externalForce,dt){
      var s=dt/1000;
      var f=-spring.stiffness*spring.angle-spring.damping*spring.velocity+externalForce;
      spring.velocity+=f*s;spring.angle+=spring.velocity*s;
    }

    var lastTime=0;
    function updateParams(now){
      var dt=lastTime?Math.min(now-lastTime,50):16;
      lastTime=now;
      params.smoothRms=params.smoothRms*0.7+params.rms*0.3;
      params.breathPhase+=dt*0.001*params.breathRate*Math.PI*2;
      updateBlink(dt);
      params.headTime+=dt*0.001;
      params.headX=Math.sin(params.headTime*0.5)*3;
      params.headY=Math.cos(params.headTime*0.7)*2;
      var hf=Math.sin(params.headTime*0.5)*50;
      updateSpring(params.hairBack,hf*0.5,dt);
      updateSpring(params.hairFront,hf*0.8,dt);
      var tg=params.isSpeaking?0.2+params.smoothRms*0.5:0;
      params.glowIntensity+=(tg-params.glowIntensity)*0.1;
    }

    /* ===== Render ===== */
    function render(){
      if(!layersReady||!layers.base)return;
      var cw=canvas.width,ch=canvas.height;
      ctx.clearRect(0,0,cw,ch);

      var scaleX=cw/MODEL_W,scaleY=ch/MODEL_H;
      var scale=Math.max(scaleX,scaleY);
      var dw=MODEL_W*scale,dh=MODEL_H*scale;
      var ox=(cw-dw)/2,oy=(ch-dh)/2-dh*0.05;

      var bs=1+Math.sin(params.breathPhase)*0.012;
      ctx.save();
      ctx.translate(ox+dw/2,oy+dh);ctx.scale(1,bs);ctx.translate(-(ox+dw/2),-(oy+dh));

      /* Base avatar with head bob */
      ctx.save();
      ctx.translate(params.headX*scale*0.3,params.headY*scale*0.3);
      ctx.drawImage(layers.base,ox,oy,dw,dh);
      ctx.restore();

      /* Mouth open overlay - smooth opacity by RMS */
      if(layers.mouth_open&&params.smoothRms>0.02){
        ctx.save();
        ctx.globalAlpha=Math.min(params.smoothRms*2.5,1);
        ctx.translate(params.headX*scale*0.3,params.headY*scale*0.3);
        var ms=1+params.smoothRms*0.15;
        var my=oy+dh*0.45;
        ctx.translate(0,my);ctx.scale(1,ms);ctx.translate(0,-my);
        ctx.drawImage(layers.mouth_open,ox,oy,dw,dh);
        ctx.restore();
      }

      /* Eyelid overlay - smooth blink with easing */
      if(layers.eyelids&&params.blinkProgress>0){
        ctx.save();
        ctx.globalAlpha=easeInOutQuad(params.blinkProgress);
        ctx.translate(params.headX*scale*0.3,params.headY*scale*0.3);
        ctx.drawImage(layers.eyelids,ox,oy,dw,dh);
        ctx.restore();
      }

      /* Hair front with spring physics */
      if(layers.hair_front){
        ctx.save();
        var ha=params.hairFront.angle*0.02;
        var px=ox+dw*0.5,py=oy+dh*0.15;
        ctx.translate(px,py);ctx.rotate(ha);ctx.translate(-px,-py);
        ctx.translate(params.headX*scale*0.5,params.headY*scale*0.4);
        ctx.drawImage(layers.hair_front,ox,oy,dw,dh);
        ctx.restore();
      }

      ctx.restore();

      /* Glow effect */
      if(params.glowIntensity>0.01){
        var gi=params.glowIntensity;
        avatarArea.style.boxShadow='inset 0 0 '+Math.round(20+gi*60)+'px '+Math.round(8+gi*20)+'px rgba(212,168,83,'+gi.toFixed(2)+')';
      }else{
        avatarArea.style.boxShadow='';
      }
    }

    /* ===== Animation loop ===== */
    function animLoop(now){updateParams(now);render();requestAnimationFrame(animLoop)}

    loadEmotionLayers('neutral').then(function(){
      params.blinkTimer=2000+Math.random()*3000;
      requestAnimationFrame(animLoop);
      logPipeline('Live2D engine started','ok');
    });

    /* ===== Emotion change ===== */
    function setEmotion(emotion){
      if(!emotion||emotion===currentEmotion)return;
      currentEmotion=emotion;
      loadEmotionLayers(emotion);
    }

    /* ===== Audio system ===== */
    var audioCtx=null,currentAudio=null,currentSource=null,currentAnalyser=null,audioRaf=null;
    var currentBlobUrl=null;

    function ensureAudioCtx(){
      if(audioCtx&&audioCtx.state!=='closed')return audioCtx;
      var AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return null;
      audioCtx=new AC();
      return audioCtx;
    }

    function stopAudio(){
      if(audioRaf){cancelAnimationFrame(audioRaf);audioRaf=null}
      if(currentAudio){
        try{currentAudio.pause()}catch(e){}
        currentAudio.onended=null;currentAudio.onerror=null;currentAudio.onpause=null;
        currentAudio=null;
      }
      if(currentSource){try{currentSource.disconnect()}catch(e){};currentSource=null}
      if(currentAnalyser){try{currentAnalyser.disconnect()}catch(e){};currentAnalyser=null}
      if(currentBlobUrl){URL.revokeObjectURL(currentBlobUrl);currentBlobUrl=null}
      params.isSpeaking=false;params.rms=0;
      avatarArea.classList.remove('speaking');
    }

    function startAudioAnalysis(analyser){
      var data=new Uint8Array(analyser.fftSize);
      avatarArea.classList.add('speaking');
      params.isSpeaking=true;
      function tick(){
        if(!audioRaf)return;
        analyser.getByteTimeDomainData(data);
        var sum=0;
        for(var i=0;i<data.length;i++){var v=(data[i]-128)/128;sum+=v*v}
        params.rms=Math.sqrt(sum/data.length);
        audioRaf=requestAnimationFrame(tick);
      }
      audioRaf=requestAnimationFrame(tick);
    }

    function playAudioBase64(b64,mime){
      if(!b64)return;
      stopAudio();
      try{
        var bin=atob(b64),bytes=new Uint8Array(bin.length);
        for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
        var blob=new Blob([bytes],{type:mime||'audio/mpeg'});
        currentBlobUrl=URL.createObjectURL(blob);
        var a=new Audio(currentBlobUrl);
        currentAudio=a;

        var actx=ensureAudioCtx();
        if(actx){
          /* Resume suspended context (iOS requirement) */
          if(actx.state==='suspended')actx.resume();
          try{
            var source=actx.createMediaElementSource(a);
            var analyser=actx.createAnalyser();
            analyser.fftSize=256;analyser.smoothingTimeConstant=0.7;
            source.connect(analyser);analyser.connect(actx.destination);
            currentSource=source;currentAnalyser=analyser;
            a.onplay=function(){startAudioAnalysis(analyser)};
          }catch(e){
            /* createMediaElementSource can fail if element already connected */
            logPipeline('Web Audio fallback: '+e.message);
            a.onplay=function(){params.isSpeaking=true;avatarArea.classList.add('speaking')};
          }
        }else{
          /* No Web Audio API - still play audio, animate with speaking flag */
          a.onplay=function(){params.isSpeaking=true;avatarArea.classList.add('speaking');params.rms=0.3};
        }
        a.onended=function(){stopAudio()};
        a.onerror=function(){stopAudio()};
        a.onpause=function(){stopAudio()};
        a.play().catch(function(e){
          logPipeline('Play failed: '+e.message,'error');
          stopAudio();
        });
      }catch(e){logPipeline('Audio error: '+e.message,'error')}
    }

    /* ===== Response overlay ===== */
    var closeBtn=document.getElementById('closeOverlay');
    if(closeBtn)closeBtn.addEventListener('click',function(){responseOverlay.classList.remove('visible')});

    function showResponse(text,transcript){
      if(responseTimer)clearTimeout(responseTimer);
      if(transcript){userSaidEl.textContent='Вы: '+transcript;userSaidEl.style.display=''}
      else{userSaidEl.textContent='';userSaidEl.style.display='none'}
      aminaSaysEl.textContent=text||'';aminaSaysEl.className='amina-says';
      responseOverlay.classList.add('visible');
    }
    function showError(text){
      if(responseTimer)clearTimeout(responseTimer);
      userSaidEl.style.display='none';
      aminaSaysEl.textContent=text;aminaSaysEl.className='amina-says error-text';
      responseOverlay.classList.add('visible');
      responseTimer=setTimeout(function(){responseOverlay.classList.remove('visible')},6000);
    }

    /* ===== Voice recording ===== */
    async function startRecording(){
      if(isProcessing||isRecording)return;
      if(!window.MediaRecorder){showError('Браузер не поддерживает запись.');return}
      responseOverlay.classList.remove('visible');
      try{
        logPipeline('Requesting mic...');
        var stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,sampleRate:16000,echoCancellation:true,noiseSuppression:true}});
        audioChunks=[];
        var mimes=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'],sel='';
        for(var i=0;i<mimes.length;i++){if(mimes[i]&&MediaRecorder.isTypeSupported(mimes[i])){sel=mimes[i];break}}
        mediaRecorder=new MediaRecorder(stream,sel?{mimeType:sel}:{});
        mediaRecorder.ondataavailable=function(e){if(e.data&&e.data.size>0)audioChunks.push(e.data)};
        mediaRecorder.onstop=function(){
          stream.getTracks().forEach(function(t){t.stop()});
          var blob=new Blob(audioChunks,{type:mediaRecorder.mimeType||'audio/webm'});
          logPipeline('Rec: '+blob.size+'B, '+(Date.now()-recordStartTime)+'ms');
          if(blob.size>100)sendVoiceToServer(blob);
          else showError('Запись слишком короткая. Говорите дольше.');
          audioChunks=[];
        };
        mediaRecorder.onerror=function(e){logPipeline('Rec err: '+(e.error?e.error.message:'?'),'error');stopRecording()};
        mediaRecorder.start(250);recordStartTime=Date.now();
        isRecording=true;micBtn.classList.add('recording');
        setStatus('Говорите... нажмите ещё раз');logPipeline('Recording','ok');
      }catch(e){
        var msg='Нет доступа к микрофону';
        if(e.name==='NotAllowedError')msg='Разрешите микрофон в настройках браузера.';
        else if(e.name==='NotFoundError')msg='Микрофон не найден.';
        showError(msg);setStatus('');logPipeline('Mic: '+e.name+' '+e.message,'error');
      }
    }

    function stopRecording(){
      if(!mediaRecorder||!isRecording)return;
      var elapsed=Date.now()-recordStartTime;
      if(elapsed<MIN_RECORD_MS){
        setStatus('Говорите дольше...');
        setTimeout(function(){if(isRecording)stopRecording()},MIN_RECORD_MS-elapsed+100);
        return;
      }
      try{if(mediaRecorder.state==='recording')mediaRecorder.stop()}catch(e){}
      isRecording=false;micBtn.classList.remove('recording');setStatus('');
    }

    async function sendVoiceToServer(blob){
      if(!initData){showError('Откройте из Telegram');return}
      setLocked(true);setStatus('Распознаю речь...');setEmotion('thinking');
      var tStart=Date.now();
      try{
        var reader=new FileReader();
        var audioBase64=await new Promise(function(resolve,reject){
          reader.onload=function(){resolve(reader.result.split(',')[1])};
          reader.onerror=function(){reject(new Error('FileReader failed'))};
          reader.readAsDataURL(blob);
        });
        logPipeline('Voice: '+Math.round(audioBase64.length/1024)+'KB');
        var controller=new AbortController();
        var timeout=setTimeout(function(){controller.abort()},30000);
        var res=await fetch(apiBase+'/mini-app/voice',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({audioBase64:audioBase64,mimeType:blob.type||'audio/webm',initData:initData}),
          signal:controller.signal
        });
        clearTimeout(timeout);
        var fetchMs=Date.now()-tStart;
        logPipeline('Server: '+fetchMs+'ms, status='+res.status);
        setStatus('Амина думает...');
        var json=await res.json().catch(function(){return null});
        if(!res.ok||!json||!json.success){
          showError((json&&json.error)||'Ошибка сервера ('+res.status+')');
          logPipeline('API err: '+((json&&json.error)||res.status),'error');return;
        }
        setStatus('');
        handleAiResponse(json.data,json.data.transcript||'');
        logPipeline('Done: '+(Date.now()-tStart)+'ms','ok');
      }catch(e){
        showError(e.name==='AbortError'?'Таймаут 30 сек. Попробуйте короче.':'Сеть недоступна: '+e.message);
        logPipeline('Voice err: '+e.message,'error');
      }finally{setLocked(false);setStatus('')}
    }

    if(micBtn)micBtn.addEventListener('click',function(){
      if(isRecording){stopRecording();if(speechRecognition)try{speechRecognition.stop()}catch(e){};return}
      if(isProcessing)return;
      responseOverlay.classList.remove('visible');
      if(useWebSpeech&&startWebSpeech())return;
      startRecording();
    });

    /* ===== TTS ===== */
    async function fetchAndPlayTTS(text){
      if(!text||text.length<3||!initData)return;
      try{
        logPipeline('TTS...');var ts=Date.now();
        var res=await fetch(apiBase+'/mini-app/tts',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({text:text,initData:initData})
        });
        var json=await res.json().catch(function(){return null});
        if(json&&json.success&&json.data&&json.data.audioBase64){
          logPipeline('TTS OK '+(Date.now()-ts)+'ms','ok');
          playAudioBase64(json.data.audioBase64,json.data.audioMimeType);
        }else{logPipeline('TTS: no audio')}
      }catch(e){logPipeline('TTS err: '+e.message,'error')}
    }

    /* ===== Web Speech API ===== */
    var SpeechRecognitionClass=window.SpeechRecognition||window.webkitSpeechRecognition;
    var isTelegramWebView=!!(window.Telegram&&window.Telegram.WebApp);
    var useWebSpeech=!!SpeechRecognitionClass&&!isTelegramWebView;
    var speechRecognition=null,webSpeechTimeout=null;
    logPipeline('WebSpeech: '+(useWebSpeech?'on':'off (TG:'+isTelegramWebView+')'));

    function startWebSpeech(){
      if(!useWebSpeech)return false;
      try{
        speechRecognition=new SpeechRecognitionClass();
        speechRecognition.lang='ru-RU';speechRecognition.interimResults=false;
        speechRecognition.maxAlternatives=1;speechRecognition.continuous=false;
        webSpeechTimeout=setTimeout(function(){
          logPipeline('WebSpeech timeout - fallback','error');
          try{speechRecognition.abort()}catch(e){}
          isRecording=false;micBtn.classList.remove('recording');
          useWebSpeech=false;startRecording();
        },5000);
        speechRecognition.onstart=function(){isRecording=true;micBtn.classList.add('recording');setStatus('Говорите...');logPipeline('WebSpeech started')};
        speechRecognition.onresult=function(event){
          clearTimeout(webSpeechTimeout);
          var t=event.results[0][0].transcript;
          logPipeline('WebSpeech: "'+t.slice(0,50)+'" conf='+Math.round(event.results[0][0].confidence*100)+'%','ok');
          isRecording=false;micBtn.classList.remove('recording');
          sendTextFromSpeech(t);
        };
        speechRecognition.onerror=function(event){
          clearTimeout(webSpeechTimeout);
          logPipeline('WebSpeech err: '+event.error,'error');
          isRecording=false;micBtn.classList.remove('recording');
          if(event.error==='no-speech'){setStatus('Не услышала. Ещё раз.');setTimeout(function(){setStatus('')},2000);return}
          useWebSpeech=false;startRecording();
        };
        speechRecognition.onend=function(){
          clearTimeout(webSpeechTimeout);
          if(isRecording){isRecording=false;micBtn.classList.remove('recording');setStatus('')}
        };
        speechRecognition.start();return true;
      }catch(e){logPipeline('WebSpeech init err: '+e.message,'error');useWebSpeech=false;return false}
    }

    async function sendTextFromSpeech(transcript){
      if(!initData||!transcript.trim())return;
      setLocked(true);setStatus('Амина думает...');setEmotion('thinking');
      var ts=Date.now();logPipeline('Text: "'+transcript.slice(0,40)+'"');
      try{
        var res=await fetch(apiBase+'/mini-app/message',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({message:transcript,initData:initData,withAudio:false})
        });
        var json=await res.json().catch(function(){return null});
        if(!res.ok||!json||!json.success){showError((json&&json.error)||'Ошибка');logPipeline('Err: '+((json&&json.error)||res.status),'error');return}
        logPipeline('AI '+(Date.now()-ts)+'ms','ok');
        var text=json.data.response||'';
        showResponse(text,transcript);setEmotion(json.data.emotion||'neutral');
        fetchAndPlayTTS(text);
      }catch(e){showError('Сеть: '+e.message);logPipeline('Err: '+e.message,'error')}
      finally{setLocked(false);setStatus('')}
    }

    function handleAiResponse(data,transcript){
      showResponse(data.response||'',transcript);
      setEmotion(data.emotion||'neutral');
      if(data.audioBase64)playAudioBase64(data.audioBase64,data.audioMimeType);
      else fetchAndPlayTTS(data.response||'');
    }

    logPipeline('Pseudo-Live2D v2 for '+(userName||'guest'),'ok');
  })();
  </script>
</body>
