name: CI

on:
  push:
    branches: [main]
  pull_request:

# Отменяем устаревшие прогоны при новом пуше в ту же ветку/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bot:
    name: Bot — typecheck & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'

      # У bot нет закоммиченного package-lock.json (он в .gitignore),
      # поэтому ставим через npm install, а не npm ci.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # npm run использует локальный node_modules/.bin/tsc — детерминированно,
      # без риска, что npx подтянет постороннюю одноимённую утилиту.
      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npx vitest run

  admin:
    name: Admin — typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck
