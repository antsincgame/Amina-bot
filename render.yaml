services:
  # ===========================================
  # Telegram Bot - Web Service
  # ===========================================
  - type: web
    name: amina-bot
    runtime: node
    region: frankfurt
    plan: starter
    rootDir: bot
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: OPENROUTER_MODEL
        value: anthropic/claude-3-haiku
      # Secrets - set in Render Dashboard
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
    autoDeploy: true

  # ===========================================
  # Admin Panel - Static Site
  # ===========================================
  - type: web
    name: amina-admin
    runtime: static
    rootDir: admin
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-XSS-Protection
        value: "1; mode=block"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        value: https://azdvlsznlvktxvmfswhq.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF6ZHZsc3pubHZrdHh2bWZzd2hxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAxNTQ5MjUsImV4cCI6MjA4NTczMDkyNX0.jRLo_4fwol9QUFRNrBAjzA_Qw0aOiB2
    autoDeploy: true
