services:
  # ===========================================
  # Telegram Bot - Simple Version (No DB)
  # ===========================================
  - type: web
    name: amina-bot
    runtime: node
    region: frankfurt
    plan: starter
    rootDir: bot
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: OPENROUTER_MODEL
        value: anthropic/claude-3-haiku
      # Secrets - set in Render Dashboard
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
    autoDeploy: true
