services:
  # ===========================================
  # Telegram Bot - Web Service
  # ===========================================
  - type: web
    name: amina-bot
    runtime: node
    region: frankfurt
    plan: starter
    rootDir: bot
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: TZ
        value: UTC
      - key: WEBHOOK_URL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      # Secrets — set in Render Dashboard
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: APPWRITE_ENDPOINT
        value: https://appwrite.vibecoding.by/v1
      - key: APPWRITE_PROJECT_ID
        value: 69af2faa003646d3574c
      - key: APPWRITE_DATABASE_ID
        value: amina
      - key: APPWRITE_API_KEY
        sync: false
      # URL админки для CORS
      - key: ADMIN_URL
        value: https://amina-admin.onrender.com
      # Домены сайтов для /api/leads (CORS)
      - key: LEAD_ORIGINS
        value: https://vibecoding.by
      # LiraX АТС интеграция
      - key: LIRAX_URL
        value: https://api.lirax.net/general
      - key: LIRAX_TOKEN
        sync: false
      - key: LIRAX_WEBHOOK_TOKEN
        sync: false
      - key: LIRAX_DEFAULT_EXT
        value: "201"
      # LM Studio API token (если включена авторизация в LM Studio)
      - key: LMSTUDIO_API_KEY
        sync: false
      - key: LMSTUDIO_TUNNEL_TOKEN
        sync: false
    autoDeploy: true

  # ===========================================
  # Admin Panel - Static Site
  # ===========================================
  - type: web
    name: amina-admin
    runtime: static
    rootDir: admin
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-XSS-Protection
        value: "1; mode=block"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_APPWRITE_ENDPOINT
        value: https://appwrite.vibecoding.by/v1
      - key: VITE_APPWRITE_PROJECT_ID
        value: 69af2faa003646d3574c
      - key: VITE_BOT_URL
        value: https://amina-bot.onrender.com
    autoDeploy: true
