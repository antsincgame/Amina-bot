services:
  # ===========================================
  # Telegram Bot - Web Service
  # ===========================================
  - type: web
    name: amina-bot
    runtime: node
    region: frankfurt
    plan: starter
    rootDir: bot
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: TZ
        value: Europe/Minsk
      # Secrets — set in Render Dashboard
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # URL админки для CORS
      - key: ADMIN_URL
        value: https://amina-admin.onrender.com
      # Домены сайтов для /api/leads (CORS)
      - key: LEAD_ORIGINS
        value: https://vibecoding.by,https://grodno.vibecoding.by
      # LiraX АТС интеграция
      - key: LIRAX_URL
        value: https://api.lirax.net/general
      - key: LIRAX_TOKEN
        sync: false
      - key: LIRAX_WEBHOOK_TOKEN
        sync: false
      - key: LIRAX_DEFAULT_EXT
        value: "201"
    autoDeploy: true

  # ===========================================
  # Admin Panel - Static Site
  # ===========================================
  - type: web
    name: amina-admin
    runtime: static
    rootDir: admin
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-XSS-Protection
        value: "1; mode=block"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_BOT_URL
        value: https://amina-bot.onrender.com
    autoDeploy: true
